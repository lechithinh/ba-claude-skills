<svg xmlns="http://www.w3.org/2000/svg" class="bpmn-svg" viewBox="-10 -10 1190 470" role="img" aria-label="Mua đồ uống tại quầy"><style>/* Theme cho SVG sinh bởi scripts/spec_to_svg.py.
   Đổi màu theo thương hiệu bằng cách sửa các biến bên dưới. */
.bpmn-svg {
  --bp-bg: #F7F5EF;          /* nền sơ đồ */
  --bp-paper: #FFFFFF;       /* nền task, event, gateway */
  --bp-ink: #1B1B1F;         /* nét và chữ */
  --bp-muted: #6B6B75;       /* chữ phụ, nhãn đường nối */
  --bp-pool: #E9E5DA;        /* dải tên pool / lane, pool thu gọn */
  --bp-pool-accent: #F2C94C; /* dải tên pool chính */
  --bp-font: "Be Vietnam Pro", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bp-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  font-family: var(--bp-font);
}
.bpmn-svg .bg { fill: var(--bp-bg); }
.bpmn-svg .pool { fill: none; stroke: var(--bp-ink); stroke-width: 2; }
.bpmn-svg .pool-head { fill: var(--bp-pool-accent); stroke: var(--bp-ink); stroke-width: 2; }
.bpmn-svg .lane-head { fill: var(--bp-pool); stroke: var(--bp-ink); stroke-width: 1.5; }
.bpmn-svg .lane-line { stroke: var(--bp-ink); stroke-width: 1.5; }
.bpmn-svg .ext-pool { fill: var(--bp-pool); stroke: var(--bp-ink); stroke-width: 2; }
.bpmn-svg .shape { fill: var(--bp-paper); stroke: var(--bp-ink); stroke-width: 2; }
.bpmn-svg .shape.end { stroke-width: 4.5; }
.bpmn-svg .shape.thin { stroke-width: 1.5; }
.bpmn-svg .shape.dashed { stroke-dasharray: 5 3; }
.bpmn-svg .ink { fill: var(--bp-ink); }
.bpmn-svg .line { fill: none; stroke: var(--bp-ink); stroke-width: 1.4; }
.bpmn-svg .flow { fill: none; stroke: var(--bp-ink); stroke-width: 2; stroke-linejoin: round; }
.bpmn-svg .msg { fill: none; stroke: var(--bp-ink); stroke-width: 1.6; stroke-dasharray: 7 5; }
.bpmn-svg text { fill: var(--bp-ink); }
.bpmn-svg .t-node { font-size: 12.5px; }
.bpmn-svg .t-label { font-size: 12px; }
.bpmn-svg .t-flow { font-size: 11px; font-family: var(--bp-mono); font-weight: 700; fill: var(--bp-ink); }
.bpmn-svg .t-msg { font-size: 11px; font-family: var(--bp-mono); fill: var(--bp-muted); }
.bpmn-svg .t-pool { font-size: 14px; font-weight: 700; }
.bpmn-svg .t-lane { font-size: 12.5px; font-weight: 700; }
</style><defs><marker id="bp-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" class="ink"/></marker><marker id="bp-msg-end" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="var(--bp-paper)" stroke="var(--bp-ink)" stroke-width="1.3"/></marker><marker id="bp-msg-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><circle cx="5" cy="5" r="3.8" fill="var(--bp-paper)" stroke="var(--bp-ink)" stroke-width="1.3"/></marker></defs><rect x="-10" y="-10" width="1190" height="470" class="bg"/><rect x="0" y="0" width="1170" height="420" class="pool"/><rect x="0" y="0" width="30" height="420" class="pool-head"/><text x="15" y="210.0" text-anchor="middle" dominant-baseline="middle" class="t-pool" transform="rotate(-90 15 210.0)">Mua đồ uống tại quầy</text><rect x="30" y="0" width="30" height="160" class="lane-head"/><text x="45" y="80.0" text-anchor="middle" dominant-baseline="middle" class="t-lane" transform="rotate(-90 45 80.0)">Khách hàng</text><rect x="30" y="160" width="30" height="260" class="lane-head"/><text x="45" y="290.0" text-anchor="middle" dominant-baseline="middle" class="t-lane" transform="rotate(-90 45 290.0)">Nhân viên quầy</text><line x1="30" y1="160" x2="1170" y2="160" class="lane-line"/><polyline points="193.0,80.0 290.0,80.0" class="flow" marker-end="url(#bp-arrow)"/><polyline points="400.0,80.0 430.0,80.0 430.0,240.0 460.0,240.0" class="flow" marker-end="url(#bp-arrow)"/><polyline points="570.0,240.0 660.0,240.0" class="flow" marker-end="url(#bp-arrow)"/><polyline points="710.0,240.0 800.0,240.0" class="flow" marker-end="url(#bp-arrow)"/><text x="755.0" y="234.0" text-anchor="middle" class="t-flow">Còn</text><polyline points="685.0,265.0 685.0,340.0 837.0,340.0" class="flow" marker-end="url(#bp-arrow)"/><text x="761.0" y="334.0" text-anchor="middle" class="t-flow">Hết</text><polyline points="910.0,240.0 1007.0,240.0" class="flow" marker-end="url(#bp-arrow)"/><circle cx="175.0" cy="80.0" r="18.0" class="shape"/><text x="175.0" y="114.0" text-anchor="middle" class="t-label">Khách tới quầy</text><rect x="290" y="45" width="110" height="70" rx="10" class="shape"/><text x="345.0" y="84.0" text-anchor="middle" class="t-node">Gọi món</text><rect x="460" y="205" width="110" height="70" rx="10" class="shape"/><text x="515.0" y="236.5" text-anchor="middle" class="t-node">Kiểm tra món</text><text x="515.0" y="251.5" text-anchor="middle" class="t-node">còn không</text><polygon points="685.0,215.0 710.0,240.0 685.0,265.0 660.0,240.0" class="shape"/><line x1="676.0714285714286" y1="231.07142857142858" x2="693.9285714285714" y2="248.92857142857142" stroke="var(--bp-ink)" stroke-width="4"/><line x1="693.9285714285714" y1="231.07142857142858" x2="676.0714285714286" y2="248.92857142857142" stroke="var(--bp-ink)" stroke-width="4"/><text x="685.0" y="201.0" text-anchor="middle" class="t-label">Còn món?</text><rect x="800" y="205" width="110" height="70" rx="10" class="shape"/><text x="855.0" y="236.5" text-anchor="middle" class="t-node">Thu tiền và</text><text x="855.0" y="251.5" text-anchor="middle" class="t-node">giao món</text><circle cx="1025.0" cy="240.0" r="18.0" class="shape end"/><text x="1025.0" y="274.0" text-anchor="middle" class="t-label">Khách nhận món</text><circle cx="855.0" cy="340.0" r="18.0" class="shape end"/><text x="855.0" y="374.0" text-anchor="middle" class="t-label">Khách không mua</text></svg>